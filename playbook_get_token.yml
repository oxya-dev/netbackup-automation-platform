---
- name: Appeler l'API NetBackup via clé API
  hosts: all
  gather_facts: no
  vars:
    netbackup_host: "https://lo3nbumsr01adm/netbackup"
    # Identifiants récupérés depuis le coffre CyberArk Conjur côté AWX
    nbuxway_lo3_username: "{{ lookup('cyberark.conjur.conjur_variable', 'Vault-Prd/LOB-restricted/r-OXYA-CLOUD-FR/UNIX-LOC-220275-nbuxway/username') }}"
    nbuxway_lo3_password: "{{ lookup('cyberark.conjur.conjur_variable', 'Vault-Prd/LOB-restricted/r-OXYA-CLOUD-FR/UNIX-LOC-220275-nbuxway/password') }}"
    # À renseigner : policy NetBackup à sauvegarder (obligatoire)
    netbackup_policy_name: ""
    # Optionnel : liste de clients à cibler (vide = tous les clients de la policy)
    netbackup_backup_clients: []
    # Optionnel : nom du schedule à utiliser (vide = schedule par défaut de la policy)
    netbackup_schedule_name: ""
    # Nom du security token à créer (obligatoire par l'API NetBackup)
    netbackup_security_token_name: "ansible-{{ inventory_hostname }}-{{ lookup('pipe', 'date +%Y%m%dT%H%M%S') }}"
    netbackup_security_token_reason: "Client enrollment"
    netbackup_security_token_allowed_count: 99999
    netbackup_security_token_valid_for: 86313600

  tasks:
    - name: Récupérer le token JWT
      ansible.builtin.uri:
        url: "{{ netbackup_host }}/login"
        method: POST
        body_format: json
        body:
          userName: "{{ nbuxway_lo3_username }}"
          password: "{{ nbuxway_lo3_password }}"
        validate_certs: no
        return_content: yes
        status_code: [200, 201]
      register: login_result

    - name: Afficher le token
      debug:
        var: login_result.json.token

    - name: " Appeler /security/securitytokens avec le JWT"
      ansible.builtin.uri:
        url: "{{ netbackup_host }}/security/securitytokens"
        method: POST
        body_format: json
        headers:
          Accept: "application/vnd.netbackup+json;version=14.0"
          Authorization: "Bearer {{ login_result.json.token }}"
          Content-Type: "application/vnd.netbackup+json;version=14.0"
        body:
          tokenName: "{{ netbackup_security_token_name }}"
          reason: "{{ netbackup_security_token_reason }}"
          allowedCount: "{{ netbackup_security_token_allowed_count | int }}"
          validFor: "{{ netbackup_security_token_valid_for | int }}"
        validate_certs: no
        return_content: yes
        status_code: [200, 201]
        timeout: 30
      register: security_token_result
      retries: 3
      delay: 5
      until: security_token_result is succeeded

    - name: Afficher la réponse complète
      debug:
        var: security_token_result.json

